[project]
name = "interview_agent"
version = "0.1.0"
description = "interview-agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.203.1,<1.0.0"
]

[project.scripts]
interview_agent = "interview_agent.main:run"
run_crew = "interview_agent.main:run"
train = "interview_agent.main:train"
replay = "interview_agent.main:replay"
test = "interview_agent.main:test"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.crewai]
type = "crew"
