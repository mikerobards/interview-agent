interview_prep_task:
  description: >
    Ask the user one relevant interview question for the job {job_position} with the following description: {job_description}
  expected_output: >
    A single, relevant interview question for the position {job_position}
  agent: interview_agent
interview_coach_task:
  description: >
    Review and provide feedback on the user's answer to the interview question
  expected_output: >
    Detailed feedback on the user's answer with bullet points on what was good, what needs improvement, and how to take it to the next level.
    Formatted as markdown without '```'
  agent: interview_coach_agent
  context:
    - interview_prep_task
  human_input: true
